name: Build HyperHDR

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - addon-hyperhdr/**
      - .github/workflows/addon-hyperhdr.yml
  pull_request:
    paths:
      - addon-hyperhdr/**
      - .github/workflows/addon-hyperhdr.yml

permissions:
  contents: read

concurrency:
  group: hyperhdr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Read image configuration
        id: config
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(jq -er '.version' addon-hyperhdr/config.json)
          image=$(jq -er --arg arch "$ARCH" '.image | gsub("\\{arch\\}"; $arch)' addon-hyperhdr/config.json)
          base=$(jq -er --arg arch "$ARCH" '.build_from[$arch]' addon-hyperhdr/build.json)
          download=$(jq -er '.args.DOWNLOAD_URL' addon-hyperhdr/build.json)
          printf '%s\n' "version=$version" "image=$image" "base=$base" "download=$download" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: addon-hyperhdr
          platforms: ${{ matrix.platform }}
          pull: true
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.config.outputs.image }}:${{ steps.config.outputs.version }}
          build-args: |
            BUILD_FROM=${{ steps.config.outputs.base }}
            BUILD_VERSION=${{ steps.config.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
            DOWNLOAD_URL=${{ steps.config.outputs.download }}
          labels: |
            io.hass.type=addon
            io.hass.name=HyperHDR
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.config.outputs.version }}
            io.hass.url=https://github.com/protyposis/ha-addons-hyperhdr
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.config.outputs.version }}
